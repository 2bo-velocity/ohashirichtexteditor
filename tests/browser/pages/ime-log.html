<!doctype html>
<meta charset="utf-8">
<title>IME event log</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 2rem; max-width: 60rem; }
  pre { background: #f3f4f6; padding: 1rem; max-height: 24rem; overflow: auto; font-size: 12px; }
  button { margin-right: .5rem; }
  label { display: block; margin: 1rem 0 .25rem; font-weight: 600; }
  input[type=text] { width: 100%; padding: .25rem .5rem; }
  textarea { width: 100%; height: 10rem; font: 12px monospace; }
</style>
<h1>IME event log</h1>
<p>
  Type into the editor with a Japanese IME: convert, confirm with Enter, make a
  list item, press Enter inside a code block. Then press <b>Copy log</b> and paste
  the result into the IME checklist. The log records each keyboard, composition
  and input event in order, with the HTML after it.
</p>
<p id="env"></p>
<label for="ime">Environment (OS, browser, IME)</label>
<input id="ime" type="text" placeholder="Windows 11 / Edge / Microsoft IME — macOS 15 / Safari / Japanese (Apple) — …">
<ohashi-rich-text-editor label="IME test" value="<p>テスト</p><ul><li>リスト</li></ul><pre><code>code</code></pre>"></ohashi-rich-text-editor>
<p><button id="copy">Copy log</button><button id="save">Save as file</button><button id="clear">Clear</button> <span id="status"></span></p>
<textarea id="out" hidden readonly></textarea>
<pre id="log"></pre>
<script type="module" src="ime-log.js"></script>
